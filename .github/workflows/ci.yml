name: Django CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: django-secret

      DEBUG: "True"

      NAME: django_project
      USER: postgres
      PASSWORD: 7777
      HOST: localhost
      PORT: 5432

      CSRF_TRUSTED_ORIGINS: "http://localhost"

      EMAIL_HOST_USER: example1111@yandex.ru
      EMAIL_HOST_PASSWORD: pppzzzpzpz

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: django_project
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 7777

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d django_project"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Poetry cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Poetry cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test

  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Poetry cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run Flake8
        run: poetry run flake8 .