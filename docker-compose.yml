services:
  web:
    container_name: atomic_habits
#    image: ${DOCKER_HUB_USERNAME}/atomic_habits:${IMAGE_TAG:-latest}
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

  nginx:
    build:
      context: ./nginx

    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles

    depends_on:
      - web

  db:
    container_name: database
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data

    env_file:
      - ./.env

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    container_name: redis
    image: redis
    volumes:
      - redis_data:/var/lib/redis/data

    env_file:
      - ./.env

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    container_name: celery_worker
#    image: ${DOCKER_HUB_USERNAME}/atomic_habits:${IMAGE_TAG:-latest}
    build: .
    command: sh -c "celery -A config worker --loglevel=info"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    container_name: celery_beat
#    image: ${DOCKER_HUB_USERNAME}/atomic_habits:${IMAGE_TAG:-latest}
    build: .
    command: sh -c "celery -A config beat --loglevel=info"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  redis_data: